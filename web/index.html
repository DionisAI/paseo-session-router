<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark"><title>總控臺 · Paseo Session Router</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/park.css"></head>
<body>
<div id="login" class="login"><div class="login-card"><div class="login-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="3.2"/><circle cx="4.5" cy="5.5" r="2"/><circle cx="19.5" cy="5.5" r="2"/><circle cx="12" cy="21" r="1.6"/><path d="M6 7l3.6 3.7M18 7l-3.6 3.7M12 16.2v3.2"/></svg></div><h1>總控臺</h1><p class="login-sub">Paseo Session Router。網頁、Muse、Grokbot 看到的是同一份機器、session 和任務。</p><form id="login-form"><label for="token">Router token</label><input id="token" name="token" type="password" autocomplete="off" placeholder="貼上網頁用的 token（PSR_WEB_TOKEN）" required><button class="login-go" type="submit">登入</button></form><p id="login-error" role="alert"></p></div></div></div>
<div id="park" class="park" hidden><div class="park-loading" role="status">正在載入總控臺…</div><canvas id="park-canvas" aria-label="機器與 session 的總覽地圖"></canvas><div id="park-labels" class="park-labels"></div><div class="park-brand"><div class="park-brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="3.2"/><circle cx="4.5" cy="5.5" r="2"/><circle cx="19.5" cy="5.5" r="2"/><circle cx="12" cy="21" r="1.6"/><path d="M6 7l3.6 3.7M18 7l-3.6 3.7M12 16.2v3.2"/></svg></div><div class="park-brand-text"><h1>總控臺</h1><p><span id="park-live">連線中</span><span id="park-mode" class="park-mode"></span></p></div><button type="button" id="logout" class="brand-logout" title="登出" aria-label="登出"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 16l-4-4 4-4M6 12h10"/></svg></button><nav class="park-nav" role="tablist" aria-label="視角"><button type="button" data-view="overview" role="tab" aria-selected="true"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5"/></svg>總覽</button><button type="button" data-view="machines" role="tab" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v6H4zM4 13h16v6H4zM8 8h.01M8 16h.01"/></svg>機器</button><button type="button" data-view="tasks" role="tab" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>任務</button><button type="button" data-view="relations" role="tab" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="6" r="2.2"/><circle cx="19" cy="6" r="2.2"/><circle cx="12" cy="18" r="2.2"/><path d="M7.2 6h9.6M6.2 7.9l4.6 8.2M17.8 7.9l-4.6 8.2"/></svg>關係</button><button type="button" data-view="policy" role="tab" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4"/></svg>權限</button></nav></div><div id="park-stats" class="park-stats" aria-live="polite"></div><div id="park-counter" class="park-counter" aria-live="polite"></div><button type="button" data-park="showcase" class="showcase-exit">退出展示（Esc）</button><div id="park-clock" class="park-clock"></div><aside id="park-roster" class="park-roster" aria-label="機器與 session"></aside><aside id="park-inspector" class="park-inspector" hidden></aside><main id="park-page" class="park-page" hidden></main><nav class="park-dock" aria-label="地圖操作"><button data-park="overview" title="回到全景"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg><span>全景</span></button><button data-park="left" class="dock-turn" title="向左轉"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg><span>左轉</span></button><button data-park="right" class="dock-turn" title="向右轉"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg><span>右轉</span></button><button data-park="zoomIn" title="拉近"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M11 8v6M8 11h6"/></svg><span>拉近</span></button><button data-park="zoomOut" title="拉遠"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M8 11h6"/></svg><span>拉遠</span></button><button data-park="labels" aria-pressed="true" title="顯示或隱藏名牌"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h11l5 5-5 5H4z"/></svg><span>名牌</span></button><button data-park="pixel" class="dock-desk" aria-pressed="true" title="像素畫風；關掉是平滑的 3D（只記在這台瀏覽器）"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg><span>像素</span></button><button data-park="tasks" title="切到任務視角"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg><span>任務</span></button><button data-park="showcase" title="展示模式：收起面板、自動巡航，適合放在副螢幕（Esc 退出）"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M9 20h6M12 16v4"/></svg><span>展示</span></button><button data-park="roster" class="dock-mobile" title="機器與 session"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4zM4 10h16"/></svg><span>列表</span></button></nav><div class="park-legend" aria-label="圖例"><span><i style="--c:#cf6e45"></i>Claude</span><span><i style="--c:#5f58c9"></i>Codex</span><b></b><span><i class="ring" style="--c:#4fcf73"></i>運行中</span><span><i class="ring" style="--c:#ffae34"></i>需留意</span><span><i class="ring" style="--c:#e0574a"></i>出錯</span></div><div class="park-legend park-legend-tasks" aria-label="任務花園圖例"><span><i class="ring" style="--c:#4fcf73"></i>步驟運行中</span><span><i class="ring" style="--c:#ffae34"></i>等你</span><span><i class="ring" style="--c:#b8b2a6"></i>排隊</span><span><i style="--c:#e88fb4"></i>完成（花色＝誰派的）</span><span><i class="ring" style="--c:#a14b3a"></i>失敗</span></div></div>
<div id="toast" role="status" hidden></div>
<script type="module" src="/app.js"></script></body></html>
