name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.16.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --prefix tools
      - run: npm run build
      - run: npm test
      # the published tool contracts must match the code
      - run: node scripts/export-openapi.mjs && git diff --exit-code docs/openapi.json docs/tool-catalog.json

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # .gitleaks.toml in the repository root extends the default rules
      # run as the checkout's owner, or git refuses the mounted repository as "dubious ownership"
      - run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner
